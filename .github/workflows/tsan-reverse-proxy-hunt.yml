name: TSan hunt (reverse proxy)

# Dispatch-only, like h2-stall-hunt: a bisection harness for the intermittent
# ThreadSanitizer failure in ReverseProxyTests, not a gate.
#
# The failure (first seen on main at 92da1f0, the reverse-proxy merge) is a data race
# reported inside NIOCore's `EventLoopFuture.get()` continuation bridge, plus an
# `abort()` attributed to whichever ReverseProxyTests case is unlucky. It reproduces
# only under TSan and only sometimes, and TSan cannot run on the maintainer's machine
# at all (macOS 26 — its runtime segfaults during its own init), so CI is the only
# place it can be studied.
#
# `suite` narrows what runs and `skip` excludes part of it; `iterations` repeats the
# selection in one process, which is what makes an intermittent race show up in a
# single job. Read the log, not the exit code.
#
# `skip` earns its keep on the question the first rounds could not answer: the failure
# is attributed to a ReverseProxyTests case, but its rate tracks how many *engines*
# the process has built, not which suite is selected — 25 clean runs of
# ReverseProxyTests alone, then a hit on iteration 2 of the whole suite. Running
# everything *except* those tests separates "these tests are broken" from "these tests
# are the ones unlucky enough to be running when something older goes wrong".
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test identifier to run (e.g. ProxyCoreTests/ReverseProxyTests, or one test)'
        required: false
        default: 'ProxyCoreTests/ReverseProxyTests'
      iterations:
        description: 'Test iterations in one process'
        required: false
        default: '20'
      skip:
        description: 'Test identifier to EXCLUDE (e.g. ProxyCoreTests/ReverseProxyTests). Empty = exclude nothing.'
        required: false
        default: ''
      suppressions:
        description: 'Load Tools/tsan/suppressions.txt (as CI does). Off = raw, to measure the flake''s real rate.'
        type: boolean
        required: false
        default: true

jobs:
  # Proof that the suppression file did not turn the CI job into a rubber stamp.
  #
  # It runs a program that *is* a data race (`Tools/tsan-canary/`) under the same
  # suppressions CI loads, and fails if TSan stays quiet. Deliberately inverted: silence
  # is the failure. Without this, widening one pattern by a word would leave every TSan
  # run green forever and nothing would say so.
  #
  # Separate job so it answers even when the hunt below times out.
  canary:
    name: Canary — a real race must still be reported
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the canary under TSan
        run: |
          swiftc -parse-as-library -sanitize=thread \
            Tools/tsan-canary/main.swift -o "${{ runner.temp }}/canary"

      - name: A real race must survive the suppressions
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/Tools/tsan/suppressions.txt:print_suppressions=1:exitcode=0
        run: |
          set -o pipefail
          "${{ runner.temp }}/canary" 2>&1 | tee "${{ runner.temp }}/canary.log" || true
          if grep -q "ThreadSanitizer: data race" "${{ runner.temp }}/canary.log"; then
            echo "::notice::TSan still reports an unsuppressed race — the gate bites."
            exit 0
          fi
          echo "::error::TSan reported nothing for a program that IS a data race."
          echo "Tools/tsan/suppressions.txt has grown too broad: the Thread Sanitizer job"
          echo "is no longer a gate. Narrow the patterns (race_top:, never race:) before"
          echo "trusting a green TSan run again."
          cat "${{ runner.temp }}/canary.log"
          exit 1

  hunt:
    name: Repeat under TSan
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      - name: Make copied module maps writable
        run: |
          find "${{ runner.temp }}/DerivedData/Build/Products" -name module.modulemap ! -perm -u+w \
            -exec chmod u+w {} + 2>/dev/null || true

      # `-test-iterations` + `-run-tests-until-failure` stops at the first bad run, so
      # the tail of the log is the failure rather than dozens of clean runs after it.
      - name: Repeat under TSan
        id: hunt
        continue-on-error: true
        # `suppressions: false` reproduces the raw flake — that is how its rate gets
        # measured now that CI no longer shows it as a failure. `true` mirrors CI, which
        # is how a *new* report (one no suppression covers) gets hunted.
        #
        # `TEST_RUNNER_TSAN_OPTIONS` as a build setting, not `env:`, for the reason
        # measured here first: a plain `env:` never reaches the xctest process (run
        # 31008307778 — 2 races, no suppression match, no load error). This is also the
        # only place that finding can be re-checked, so keep the two workflows using the
        # same channel.
        run: |
          set -o pipefail
          TSAN_SETTING=""
          if [ "${{ inputs.suppressions }}" = "true" ]; then
            TSAN_SETTING="TEST_RUNNER_TSAN_OPTIONS=suppressions=${{ github.workspace }}/Tools/tsan/suppressions.txt:print_suppressions=1:verbosity=1"
          fi
          xcodebuild test \
            -workspace Loom.xcworkspace \
            -scheme ProxyCoreTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -enableThreadSanitizer YES \
            -only-testing:'${{ inputs.suite }}' \
            ${{ inputs.skip != '' && format('-skip-testing:{0}', inputs.skip) || '' }} \
            -test-iterations '${{ inputs.iterations }}' \
            -run-tests-until-failure \
            -resultBundlePath "${{ runner.temp }}/TSanHunt.xcresult" \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES \
            ${TSAN_SETTING:+"$TSAN_SETTING"} \
            2>&1 | tee "${{ runner.temp }}/tsan-hunt.log"

      # The whole point: how many races, in what, and which test aborted. A run that
      # reproduced nothing is a real answer too (raise `iterations`), so this always
      # prints rather than only on failure.
      - name: Summarize
        if: always()
        run: |
          echo "### TSan hunt: ${{ inputs.suite }} × ${{ inputs.iterations }} (skip: '${{ inputs.skip }}')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "suppressions loaded: ${{ inputs.suppressions }}" >> "$GITHUB_STEP_SUMMARY"
          echo "races reported: $(grep -c 'WARNING: ThreadSanitizer' "${{ runner.temp }}/tsan-hunt.log" || true)" \
            >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Matched .* suppressions' "${{ runner.temp }}/tsan-hunt.log" | sort -u | head -3 \
            >> "$GITHUB_STEP_SUMMARY" || true
          grep -E 'SUMMARY: ThreadSanitizer' "${{ runner.temp }}/tsan-hunt.log" | sort -u | head -5 \
            >> "$GITHUB_STEP_SUMMARY" || true
          grep -E '✗|crashed with signal' "${{ runner.temp }}/tsan-hunt.log" | head -10 \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-hunt-log
          path: ${{ runner.temp }}/tsan-hunt.log
          if-no-files-found: warn
