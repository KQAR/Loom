name: CI

# Every PR and every push to main must build the whole graph and run all five
# test bundles. Before this existed the only workflow was Release (tag-driven,
# archive-only), so ~425 tests ran on developer machines and nowhere else.
# Exception: a docs-only change (*.md / docs/ / LICENSE) skips the build jobs —
# see the `changes` job for why that's a conditional skip, not paths-ignore.
#
# The pass condition is deliberately NOT xcodebuild's exit code — see
# scripts/assert-tests-ran.sh for why a green `** TEST SUCCEEDED **` can mean
# zero tests executed.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the in-flight run for the same ref; a full build is
# ~10 minutes of runner time and the older answer is worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes (*.md, docs/, LICENSE) skip the three build jobs. This is
  # a conditional-job skip, NOT a workflow-level paths-ignore: the three jobs
  # are required status checks, and a workflow that never triggers never
  # reports, leaving the PR blocked forever — whereas a job skipped by `if:`
  # reports "skipped", which branch protection treats as passing. Anything
  # ambiguous (unknown base, empty diff) falls through to running everything.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against base
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "Base commit unknown — running full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files:"; echo "$CHANGED"
          NON_DOCS=$(echo "$CHANGED" | grep -vE '(^docs/|\.md$|^LICENSE$)' || true)
          if [ -n "$CHANGED" ] && [ -z "$NON_DOCS" ]; then
            echo "Docs-only change — build jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # The real gate: the Tuist graph (app + engine + MCP + helper) compiles and
  # all five test bundles pass.
  test:
    name: Build & test
    runs-on: macos-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # Own key, separate from the Release workflow's, so the two don't fight over
      # one entry.
      # Dependency *sources* only. Build products deliberately NOT cached: the
      # generated Xcode projects depend on Tuist/Package.swift (product types) as
      # much as on Package.resolved, the restore-key falls back by prefix across
      # branches, and a DerivedData built under one graph reused under another
      # produces failures that look like source bugs. Measured: it cost hours here —
      # a `Cycle inside CNIOFreeBSD` no local build could reproduce, then a
      # `module map file … not found` once the graph changed under the stale
      # products. Re-downloading checkouts is what actually took the time; those
      # stay cached, safely keyed on Package.resolved.
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            Tuist/.build
          key: ${{ runner.os }}-loom-ci-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-loom-ci-

      # The one failure mode no other gate can see: a custom SF Symbol that
      # compiles clean (actool exits 0, Assets.car is complete, `Image(_:)` has
      # no compile-time check) and is still nil at runtime, because CoreUI
      # refused to decode it — the menu-bar icon silently disappears. check.py
      # compiles the catalog and asks a real bundle for each symbol back, which
      # is the only trustworthy answer. Runs before the build so a broken mark
      # fails in seconds instead of after a 10-minute test run.
      - name: Verify custom SF Symbols resolve at runtime
        run: python3 Tools/symbol-template/check.py

      - name: Install dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      - name: Test
        run: |
          xcodebuild test \
            -workspace Loom.xcworkspace \
            -scheme Loom-Workspace \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -resultBundlePath "${{ runner.temp }}/Tests.xcresult" \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES

      # Runs even when xcodebuild failed, so the summary names the failing tests
      # instead of burying them in build noise.
      - name: Verify every bundle actually ran
        if: always()
        run: |
          scripts/assert-tests-ran.sh "${{ runner.temp }}/Tests.xcresult" \
            AppFeatureTests \
            MCPServerTests \
            PrivilegedHelperClientTests \
            ProxyCoreTests \
            SharedModelsTests

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/Tests.xcresult
          retention-days: 7

  # The embeddable-library graph (root Package.swift → LoomSharedModels +
  # LoomProxyCore) resolves independently of Tuist, so it can rot without the
  # app build noticing. Reticle consumes exactly this.
  package:
    name: SPM library
    runs-on: macos-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-loom-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-loom-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # ProxyCore's channel handlers are @unchecked Sendable in Swift 5 language
  # mode — the compiler checks nothing there, so TSan is the only thing that
  # does. Scoped to ProxyCoreTests: that's where real channels, sockets and the
  # actor/NIO boundary actually run.
  #
  # Blocking: the baseline is clean (229 tests instrumented, zero races). Note
  # TSan's runtime segfaults during its own init on macOS 26 — reproducible with
  # an empty `int main(){}`, so it can't be run locally on such a machine, only
  # here. That's also why "Report races" treats a run that didn't complete as
  # inconclusive-and-failing: a broken sanitizer must never read as "no races".
  thread-sanitizer:
    name: Thread Sanitizer (ProxyCore)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # Sources only, no build products — see the Build & test job's cache above.
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            Tuist/.build
          key: ${{ runner.os }}-loom-tsan-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-loom-tsan-

      - name: Install dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      # halt_on_error stays off so one run reports every race, not just the
      # first. The log is the signal; the exit code is only used to tell a real
      # failure apart from an inconclusive run.
      #
      # One suppression is loaded — the upstream continuation-bridge report that reddened
      # this job three times running, twice on a diff of two version-number strings. The
      # file itself argues why it is safe (`race_top:`, no Loom symbol) and
      # `Tools/tsan-canary/` proves it, run by the TSan-hunt workflow. `print_suppressions`
      # keeps the flake *visible*: a suppressed report is still counted in the log, so its
      # frequency stays observable instead of becoming silence.
      #
      # `TEST_RUNNER_TSAN_OPTIONS` as an *environment variable*, and every part of that
      # is measured rather than assumed, because each wrong form failed **silently** —
      # no error, just a run with no protection that looks exactly like a clean one:
      #   1. `env: TSAN_OPTIONS` — run 31008307778, 2 races, no suppression match.
      #      xcodebuild launches xctest with a scrubbed environment.
      #   2. `TEST_RUNNER_TSAN_OPTIONS=` as a *build setting* — run 31010431002, 2 races.
      #      It reached only the build environment. That run is what ruled out the other
      #      hypothesis: its write-side top frame was the glue itself, so `race_top:`
      #      should have matched and didn't, which leaves the channel, not the pattern.
      #   3. This form — the documented meaning of the prefix: xcodebuild strips
      #      `TEST_RUNNER_` and hands the rest to the test runner process.
      # Ruled out entirely: `__tsan_default_suppressions()` compiled into the test target.
      # TSan reads suppressions during its own init, before the test bundle loads, and the
      # host executable is Apple's `xctest`.
      #
      # If the path is ever wrong, TSan fails loudly at startup instead of running
      # unprotected — the failure mode to want from a config file that can only be
      # validated in CI (TSan cannot run on the maintainer's machine — see CLAUDE.md).
      - name: Test under TSan
        id: tsan
        continue-on-error: true
        env:
          TEST_RUNNER_TSAN_OPTIONS: suppressions=${{ github.workspace }}/Tools/tsan/suppressions.txt:print_suppressions=1
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Loom.xcworkspace \
            -scheme ProxyCoreTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -enableThreadSanitizer YES \
            -resultBundlePath "${{ runner.temp }}/TSan.xcresult" \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES \
            2>&1 | tee "${{ runner.temp }}/tsan.log"

      # Same reason as the test job: a run of zero tests reports zero races.
      - name: Verify the suite actually ran
        if: always()
        run: scripts/assert-tests-ran.sh "${{ runner.temp }}/TSan.xcresult" ProxyCoreTests

      - name: Report races
        run: |
          LOG="${{ runner.temp }}/tsan.log"
          # Suppressed reports are counted, not hidden: this is the only place the
          # upstream flake's frequency is still observable now that it no longer
          # fails the job. A count that climbs across releases is worth knowing;
          # a count that drops to zero means either the toolchain fixed it or the
          # patterns stopped matching, and the canary tells those two apart.
          if grep -q "Matched .* suppressions" "$LOG"; then
            echo "::notice::TSan suppressed known-upstream reports (swiftlang/swift#57803):"
            grep -A 5 "Matched .* suppressions" "$LOG" || true
          elif ! grep -q "ThreadSanitizer" "$LOG"; then
            # Neither a report nor a suppression match. Most likely the run was simply
            # clean — the flake is probabilistic. But it is also what a *silently
            # unloaded* suppressions file looks like, which is how the first attempt at
            # this failed, so say so instead of reading the silence as protection.
            echo "::warning::No TSan report and no suppression match — either a clean run \
          or TEST_RUNNER_TSAN_OPTIONS stopped reaching the test process. Confirm with the \
          TSan-hunt workflow (suppressions: true) before trusting a streak of green."
          fi
          if grep -q "ThreadSanitizer: data race" "$LOG"; then
            echo "::error::TSan reported data race(s) that no suppression covers:"
            grep -A 40 "WARNING: ThreadSanitizer" "$LOG" || true
            exit 1
          fi
          if [ "${{ steps.tsan.outcome }}" != "success" ]; then
            echo "::warning::TSan run did not complete — inconclusive, not a clean baseline."
            tail -40 "$LOG" || true
            exit 1
          fi
          echo "No data races reported."

      - name: Upload TSan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: ${{ runner.temp }}/tsan.log
          retention-days: 7
